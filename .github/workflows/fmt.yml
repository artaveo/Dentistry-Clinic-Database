name: cargo fmt (temporary)
on:
  push:
    branches: ["fmt/**"]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name "cargo fmt"
          git config user.email "fmt@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "cargo fmt"
          git push
