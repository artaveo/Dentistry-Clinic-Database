name: cargo fmt + contract + Rust checks (temporary, fmt/** branches)
on:
  push:
    branches: ["fmt/**"]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - name: Regenerate the TypeScript contract
        run: cargo test -p artaveo-shared
      - name: Commit formatting and contract
        run: |
          git config user.name "cargo fmt"
          git config user.email "fmt@users.noreply.github.com"
          git checkout -- Cargo.lock
          git add -A
          git diff --cached --quiet || git commit -m "cargo fmt + contract.ts"
          git push
  rust:
    needs: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy -p artaveo-core -p artaveo-shared -p artaveo-lan --all-targets --features artaveo-core/dev-server --message-format=json -- -D warnings | node .github/scripts/cargo-annotate.mjs
      - name: tests
        run: |
          set -o pipefail
          cargo test -p artaveo-core -p artaveo-shared -p artaveo-lan --message-format=json | node .github/scripts/cargo-annotate.mjs
