name: cargo fmt + contract (temporary)
on:
  push:
    branches: ["fmt/**"]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test -p artaveo-shared export_typescript_contract
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "cargo fmt"
            git config user.email "fmt@users.noreply.github.com"
            git commit -am "cargo fmt + regenerate contract.ts"
            git push
          fi
