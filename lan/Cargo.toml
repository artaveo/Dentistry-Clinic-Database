[package]
name = "artaveo-lan"
description = "Artaveo Dental LAN mode transport: mDNS discovery, SPAKE2 pairing, pinned TLS, WebSocket RPC and live events (ADR-02, ADR-18)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
artaveo-core.workspace = true
artaveo-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hmac = "0.12"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# `ring` instead of the default aws-lc-rs: no cmake/NASM needed on Windows builders.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
spake2 = "0.4"
mdns-sd = "0.11"
if-addrs = "0.13"

[dev-dependencies]
tempfile = "3"
