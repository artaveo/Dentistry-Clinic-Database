[workspace]
resolver = "2"
members = [
    "key-protect",
    "sqlcipher-core",
    "lan-mode",
    "usb-identity",
    "escpos",
    "shamsi",
    "tauri-shell",
]
# tauri-shell needs WebView2 (Windows) or webkit2gtk (Linux) to build,
# so plain `cargo test` only covers the portable spikes.
default-members = [
    "key-protect",
    "sqlcipher-core",
    "lan-mode",
    "usb-identity",
    "escpos",
    "shamsi",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
